name: "PR"

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    name: "Test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          # Latest 3.4 patch. An exact .ruby-version patch is missing on a new ubuntu-latest image.
          ruby-version: '3.4'
          bundler-cache: true
      - name: Install dependencies
        run: bundle install
      - name: Run tests
        run: bundle exec rspec
      - name: Run Rubocop
        run: bundle exec rubocop
