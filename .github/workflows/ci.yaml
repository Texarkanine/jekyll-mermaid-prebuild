name: "PR"

on:
  pull_request:
    branches:
      - main

jobs:
  ruby-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ruby.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: ruby
        run: echo "version=$(tr -d '[:space:]' < .ruby-version)" >> "$GITHUB_OUTPUT"

  test:
    name: "Test"
    needs: ruby-version
    runs-on: ubuntu-latest
    container:
      image: "ruby:${{ needs.ruby-version.outputs.version }}"
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: bundle install
      - name: Run tests
        run: bundle exec rspec
      - name: Run Rubocop
        run: bundle exec rubocop
