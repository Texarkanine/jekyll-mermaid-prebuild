name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write  # Required for OIDC trusted publishing

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GEM_NAME: jekyll-mermaid-prebuild

jobs:
  ruby-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ruby.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: ruby
        run: echo "version=$(tr -d '[:space:]' < .ruby-version)" >> "$GITHUB_OUTPUT"

  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.HELPER_APP_ID }}
          private-key: ${{ secrets.HELPER_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.generate-token.outputs.token }}

  publish-gem:
    needs: [release-please, ruby-version]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    container:
      image: "ruby:${{ needs.ruby-version.outputs.version }}"
    environment: rubygems.org
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: bundle install

      - name: Run tests with coverage
        run: bundle exec rspec

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Build gem
        run: gem build ${{ env.GEM_NAME }}.gemspec

      - name: Configure RubyGems credentials
        uses: rubygems/configure-rubygems-credentials@v2.1.0

      - name: Publish to RubyGems
        run: gem push ${{ env.GEM_NAME }}-${{ needs.release-please.outputs.version }}.gem
