name: "Release PR"

on:
  pull_request:
    paths:
      - 'lib/jekyll-mermaid-prebuild/version.rb'

permissions:
  contents: write

jobs:
  ruby-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ruby.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: ruby
        run: echo "version=$(tr -d '[:space:]' < .ruby-version)" >> "$GITHUB_OUTPUT"

  update-gemfile-lock:
    name: "Update Gemfile.lock"
    # Only run on Release Please PRs
    if: startsWith(github.head_ref, 'release-please--')
    needs: ruby-version
    runs-on: ubuntu-latest
    container:
      image: "ruby:${{ needs.ruby-version.outputs.version }}"
    steps:
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.HELPER_APP_ID }}
          private-key: ${{ secrets.HELPER_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ steps.generate-token.outputs.token }}

      - name: Update Gemfile.lock
        run: bundle install

      - name: Commit updated Gemfile.lock
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 2
          max_attempts: 3
          retry_wait_seconds: 5
          command: |
            git config user.name "${{ github.event.pull_request.user.login }}"
            git config user.email "${{ github.event.pull_request.user.id }}+${{ github.event.pull_request.user.login }}@users.noreply.github.com"
            if ! git diff --quiet Gemfile.lock; then
              git pull --rebase origin ${{ github.head_ref }}
              git add Gemfile.lock
              git commit -m "chore(deps): update Gemfile.lock for new version"
              git push
            fi
